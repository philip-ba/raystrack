[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raystrack"
version = "1.0.2"
description = "Reusable scene and solver API for Monte Carlo view factors on CPU, CUDA and portable GPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philip Balizki", email = "philip@metis.earth" }]
requires-python = ">=3.9,<3.14"

dependencies = [
    "numpy>=1.24,<3.0",
    "numba>=0.60,<0.65",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
portable-gpu = ["taichi>=1.7.4,<1.8"]
cuda = ["numba-cuda>=0.20"]

[project.urls]
Homepage = "https://github.com/philip-ba/raystrack"

# Ensure setuptools finds the package in the src/ layout for editable installs
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
  "tests*",
  "examples*",
  "build*",
]
